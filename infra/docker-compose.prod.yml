# Producción en un VPS: solo Caddy publica puertos (80/443). Base de datos, Redis, ClamAV, la API
# Java y el agente de IA viven en una red interna sin salida a internet (el agente es el único,
# junto a ClamAV, con salida: llama a Gemini y ClamAV actualiza sus firmas).
#
#   cp .env.prod.example .env.prod   # y completar los secretos
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#   # Flyway (API Java) aplica las migraciones al arrancar. Primera organización, sin abrir el
#   # registro público:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm \
#       -e MEDTENDER_ADMIN_PASSWORD='...' agente python -m app.cli crear-tenant \
#       --nombre "Hospital X" --nit 900123 --email admin@hospital.co
name: medtender-prod

x-endurecido: &endurecido
  restart: unless-stopped
  # Contenedor endurecido: sin privilegios, sistema de archivos de solo lectura.
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp:size=512m

x-agente: &agente
  <<: *endurecido
  build:
    context: ../agente
  image: medtender-agente:prod
  environment: &entorno_agente
    ENTORNO: produccion
    LOG_JSON: "true"
    DATABASE_URL: postgresql+asyncpg://medtender_app:${APP_DB_PASSWORD:?defina APP_DB_PASSWORD}@postgres:5432/medtender
    REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD}@redis:6379/0
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN}
    METRICS_TOKEN: ${METRICS_TOKEN:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    EMBEDDING_MODEL_DEFAULT: ${EMBEDDING_MODEL_DEFAULT:-gemini-embedding-001}
    LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
    COLA_BACKEND: arq
    EPHEMERAL_DIR: /var/medtender-ephemeral
    BARRIDO_HABILITADO: "false"  # el barrido de purga lo ejecuta el worker
  networks: [interna, externa]

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: medtender
      POSTGRES_USER: medtender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    command: ["postgres", "-c", "log_min_duration_statement=1000", "-c", "max_connections=100"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medtender -d medtender"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: Redis guarda la cola de trabajos y los límites; nunca debe descartar claves.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD}",
              "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [interna]

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
    # Necesita salida a internet para actualizar firmas.
    networks: [interna, externa]

  # API pública (Spring Boot). Aplica las migraciones de Flyway al arrancar. Sin salida a internet.
  api:
    <<: *endurecido
    build:
      context: ../api-java
    image: medtender-api:prod
    environment:
      SPRING_PROFILES_ACTIVE: produccion   # logs JSON
      ENTORNO: produccion
      CONFIAR_PROXY: "true"
      ALLOW_TENANT_SIGNUP: "false"
      # Cuentas personales: el correo se confirma antes de subir o consultar. Requiere un servidor SMTP.
      CORREO_VERIFICACION_OBLIGATORIA: "true"
      CORREO_BASE_URL: https://${DOMINIO:?defina DOMINIO}
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USER:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      DATABASE_URL: jdbc:postgresql://postgres:5432/medtender
      # La API opera con el rol sin privilegios `medtender_app` (RLS en vigor); Flyway migra como propietario.
      DATABASE_USER: medtender_app
      DATABASE_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD}
      MIGRACION_USER: medtender
      MIGRACION_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      AGENTE_URL: http://agente:8000
      AGENTE_TOKEN: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN}
      ANTIVIRUS_BACKEND: clamav
      CLAMAV_HOST: clamav
      CORS_ORIGINS: https://${DOMINIO:?defina DOMINIO}
      EPHEMERAL_DIR: /var/medtender-ephemeral
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
    volumes:
      - ephemeral:/var/medtender-ephemeral
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks: [interna]

  # Agente de IA (FastAPI). Solo la API Java le habla, con X-Internal-Token. Nunca se publica.
  agente:
    <<: *agente
    volumes:
      - ephemeral:/var/medtender-ephemeral
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy   # Flyway ya creó el rol medtender_app

  worker:
    <<: *agente
    command: ["arq", "app.worker.WorkerSettings"]
    volumes:
      - ephemeral:/var/medtender-ephemeral
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      api:
        condition: service_healthy   # Flyway ya aplicó las migraciones
      redis:
        condition: service_healthy

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    entrypoint: ["bash", "/scripts/backup.sh"]
    command: ["loop"]
    environment:
      PGHOST: postgres
      PGUSER: medtender
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: medtender
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?defina BACKUP_PASSPHRASE porque los respaldos contienen texto confidencial}
      RETENCION_DIAS: ${BACKUP_RETENCION_DIAS:-14}
      INTERVALO_HORAS: ${BACKUP_INTERVALO_HORAS:-24}
    volumes:
      - ./backup:/scripts:ro
      - ${BACKUP_DIR:-backups}:/backups
    healthcheck:
      # Sana si hubo una copia correcta en las últimas 36 h.
      test: ["CMD-SHELL", "test -f /backups/ultimo_ok && [ $$(( $$(date +%s) - $$(cat /backups/ultimo_ok) )) -lt 129600 ]"]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 5m
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  caddy:
    build:
      context: ../frontend
    image: medtender-web:prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [externa, interna]

networks:
  # Sin salida a internet: aquí viven la base de datos, Redis y los respaldos.
  interna:
    internal: true
  externa: {}

volumes:
  pgdata:
  redisdata:
  clamav-db:
  ephemeral:
  backups:
  caddy_data:
  caddy_config:
