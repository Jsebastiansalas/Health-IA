name: medtender

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: medtender
      POSTGRES_USER: medtender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medtender}
    ports:
      - "${MT_PG_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medtender -d medtender"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${MT_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    ports:
      - "${MT_CLAMAV_PORT:-3310}:3310"
    volumes:
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav-db:/var/lib/clamav
    # La primera descarga de firmas tarda varios minutos.
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20

  api:
    build:
      context: ../backend
    image: medtender-backend:dev
    env_file:
      - ../backend/.env
    environment: &entorno_backend
      DATABASE_URL: postgresql+asyncpg://medtender:${POSTGRES_PASSWORD:-medtender}@postgres:5432/medtender
      REDIS_URL: redis://redis:6379/0
      CLAMAV_HOST: clamav
      EPHEMERAL_DIR: /var/medtender-ephemeral
      COLA_BACKEND: arq
      # El barrido de purga lo ejecuta el worker (cron), no la API.
      BARRIDO_HABILITADO: "false"
    ports:
      - "${MT_API_PORT:-8010}:8000"
    # Volumen dedicado compartido con el worker. Los PDFs nunca salen de aquí.
    volumes:
      - ephemeral:/var/medtender-ephemeral
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  # Extracción, OCR selectivo y fragmentación (Sprint 3) + barrido de purga.
  worker:
    image: medtender-backend:dev
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - ../backend/.env
    environment:
      <<: *entorno_backend
    volumes:
      - ephemeral:/var/medtender-ephemeral
    depends_on:
      api:
        condition: service_started  # la API aplica las migraciones al arrancar

  # Proveedor de embeddings local (Fase 2). Se activa con: docker compose --profile local up
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
  clamav-db:
  ephemeral:
