# Desarrollo local. Requiere infra/.env (ver .env.example) y agente/.env con las keys de IA.
#
#   docker compose up -d --build
#   # web: http://localhost:8088
name: medtender

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: medtender
      POSTGRES_USER: medtender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medtender}
    ports:
      - "${MT_PG_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medtender -d medtender"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${MT_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    ports:
      - "${MT_CLAMAV_PORT:-3310}:3310"
    volumes:
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav-db:/var/lib/clamav
    # La primera descarga de firmas tarda varios minutos.
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20

  # API pública (Spring Boot): identidad, expedientes, ingesta, límites y auditoría. Aplica las
  # migraciones de Flyway al arrancar. Es lo único que el frontend ve.
  api:
    build:
      context: ../api-java
    image: medtender-api:dev
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/medtender
      DATABASE_USER: medtender
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-medtender}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET en infra/.env}
      AGENTE_URL: http://agente:8000
      AGENTE_TOKEN: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN en infra/.env}
      CLAMAV_HOST: clamav
      EPHEMERAL_DIR: /var/medtender-ephemeral
      # 5173: Vite en desarrollo. 4173: `vite preview` del build de producción.
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
    ports:
      - "${MT_API_PORT:-8010}:8080"
    # Volumen dedicado compartido con el agente y el worker. Los PDFs nunca salen de aquí.
    volumes:
      - ephemeral:/var/medtender-ephemeral
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  # Agente de IA (FastAPI): solo la API Java le habla (X-Internal-Token). No autentica usuarios.
  agente:
    build:
      context: ../agente
    image: medtender-agente:dev
    env_file:
      - ../agente/.env
    environment: &entorno_agente
      DATABASE_URL: postgresql+asyncpg://medtender:${POSTGRES_PASSWORD:-medtender}@postgres:5432/medtender
      REDIS_URL: redis://redis:6379/0
      EPHEMERAL_DIR: /var/medtender-ephemeral
      COLA_BACKEND: arq
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN en infra/.env}
      OLLAMA_URL: http://ollama:11434
      # El barrido de purga lo ejecuta el worker (cron), no este proceso.
      BARRIDO_HABILITADO: "false"
    ports:
      - "127.0.0.1:${MT_AGENTE_PORT:-8012}:8000"   # solo para depurar desde esta máquina
    volumes:
      - ephemeral:/var/medtender-ephemeral
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Extracción, OCR selectivo, fragmentación, vectorización y purga + barrido de huérfanos.
  worker:
    image: medtender-agente:dev
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - ../agente/.env
    environment:
      <<: *entorno_agente
    volumes:
      - ephemeral:/var/medtender-ephemeral
    depends_on:
      agente:
        condition: service_started
      api:
        condition: service_healthy  # Flyway ya aplicó las migraciones

  # Web (build de producción servida por Caddy, solo HTTP): http://localhost:8088
  # Alternativa con recarga en caliente: cd ../frontend && npm run dev  (http://localhost:5173)
  web:
    build:
      context: ../frontend
    image: medtender-web:dev
    environment:
      DOMINIO: http://localhost
      ACME_EMAIL: dev@localhost
    ports:
      - "${MT_WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy

  # Proveedor de embeddings local (Fase 2). Se activa con: docker compose --profile local up
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
  clamav-db:
  ephemeral:
