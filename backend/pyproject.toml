[project]
name = "medtender-backend"
version = "0.1.0"
description = "MedTender RAG: gestor inteligente de licitaciones médicas y auditoría en salud"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.18",
    "pypdf>=5.1",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.13",
    "pillow>=11",
    "tiktoken>=0.8",
    "arq>=0.26",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.8",
    "psycopg[binary]>=3.2",
    "ruff>=0.8",
    "mypy>=1.13",
    "reportlab>=4.2",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008"]  # Depends() en argumentos por defecto es el patrón de FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ASYNC240"]
"alembic/versions/*" = ["E501"]  # SQL literal
