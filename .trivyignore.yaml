# Excepciones del análisis de imágenes (.github/workflows/imagenes.yml). Cada una va limitada a un aviso, a un
# paquete en una versión exacta y a una fecha; al vencer, el aviso vuelve a aparecer.
#
# Revisión del 25-nov-2026 con los avisos de spring.io: no hay arreglo gratuito en Spring 6.2 (el de 6.2.20 es
# solo de soporte empresarial; el gratuito está en 7.0.9) y MedTender no cumple sus condiciones. La prueba
# api-java/.../CondicionesCveSpringIT falla si la aplicación empieza a cumplirlas: entonces se quita la excepción.
# Al migrar a Spring 7.0.9 o posterior se borran estas entradas y esa prueba.
# Antes de alargar la fecha, vuelve a leer los avisos: pueden haber cambiado.
vulnerabilities:
  - id: CVE-2026-47884
    purls:
      - "pkg:maven/org.springframework/spring-webmvc@6.2.19"
    expired_at: 2027-02-23
    statement: >-
      Spring la califica media. Requiere XsltView y una ruta «/**» que dibuje una vista sin nombre; MedTender no usa
      XsltView ni dibuja vistas propias. https://spring.io/security/cve-2026-47884
  - id: CVE-2026-47890
    purls:
      - "pkg:maven/org.springframework/spring-webmvc@6.2.19"
    expired_at: 2027-02-23
    statement: >-
      Spring la califica baja. Requiere enviar fragmentos de vista por eventos del servidor (SSE); MedTender no envía
      eventos ni fragmentos. https://spring.io/security/cve-2026-47890
