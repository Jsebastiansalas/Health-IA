# Construye las imágenes de producción y busca vulnerabilidades graves que ya tengan arreglo. También cada lunes:
# una imagen que ayer estaba limpia puede no estarlo hoy.
name: Imágenes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

env:
  # Trivy 0.76.2, fijado por su huella (no por etiqueta, que se puede mover).
  TRIVY: aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  escanear:
    name: ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: api, contexto: api-java }
          - { nombre: agente, contexto: agente }
          - { nombre: web, contexto: frontend }
          - { nombre: respaldos, contexto: infra/backup }
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t medtender-${{ matrix.nombre }}:ci ${{ matrix.contexto }}
      - name: Vulnerabilidades altas y críticas con arreglo disponible
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --scanners vuln
          medtender-${{ matrix.nombre }}:ci
