# Pruebas que van más allá de las unitarias: aplicación completa en navegador, respaldos, monitoreo, proxy y
# presupuesto del build. (Las unitarias de agente, API y web van en su propio flujo.)
name: Calidad

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navegador:
    name: Recorrido completo en navegador
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Navegador de Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: bash infra/scripts/e2e.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: recorrido-fallido
          path: e2e/resultados/  # capturas y traza; los datos son inventados
          retention-days: 7

  infraestructura:
    name: Redes, respaldos, monitoreo y proxy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: python3 infra/scripts/comprobar_compose.py
      - run: bash infra/scripts/probar_respaldos.sh
      - run: bash infra/scripts/probar_monitoreo.sh
      - run: bash infra/scripts/probar_proxy_errores.sh

  build-web:
    name: Presupuesto del build de la web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build && npm run comprobar:build
        working-directory: frontend

  # La imagen de producción compila y corre con Java 21; el equipo de desarrollo usa Java 26. Aquí se prueba la
  # segunda, para que lo que pasa en el equipo y lo que pasa en CI sea lo mismo.
  api-java-del-equipo:
    name: API con el Java del equipo (26)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26
          cache: maven
      - run: mvn -B -q test
        working-directory: api-java
