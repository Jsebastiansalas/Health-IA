# Análisis de seguridad del código. En un repositorio privado requiere GitHub Advanced Security; en uno público
# es gratuito.
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "30 12 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    name: ${{ matrix.lenguaje }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [java-kotlin, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
